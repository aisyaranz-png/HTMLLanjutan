<h2>Form Awalan</h2> 
    <form>    
        <label for="nama">Nama:</label>    
        <input type="text" id="nama" name="nama"><br><br> 

        <label for="nim">Nim:</label>    
        <input type="text" id="nim" name="nim"><br><br>  

        <label for="email-awal">Email:</label>    
        <input type="email" id="email-awal" name="email"><br><br> 

        <label for="alamat">Alamat:</label>    
        <input type="text" id="alamat" name="alamat"><br><br>  
        <button type="submit">Kirim</button> 
    </form>

<h2>Form Pendaftaran</h2>
    <form>  
        <label for="username">Username:</label>    
        <input type="text" id="username" name="username"><br><br>

        <label for="email">Email:</label>    
        <input type="email" id="email" name="email"><br><br>    

        <label for="sandi">Sandi:</label>    
        <input type="password" id="sandi" name="sandi"><br><br>  

        <button type="submit">Kirim</button> 
    </form>

<h2>Form Pemesanan</h2>

    <form>
        <label for="jumlah">Jumlah Pesanan:</label><br>
        <input type="number" id="jumlah" name="jumlah" min="1" max="10"><br><br>

        <label for="tanggal">Tanggal Pemesanan:</label><br>
        <input type="date" id="tanggal" name="tanggal"><br><br>

        <label for="telepon">Nomor Telepon:</label><br>
        <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx"><br><br>

        <input type="submit" value="Pesan">
    </form>
